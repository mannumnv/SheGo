server:
  port: ${PORT:8080}

spring:
  application:
    name: shego-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shego}
    username: ${DB_USERNAME:shego}
    password: ${DB_PASSWORD:shego}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

shego:
  aws:
    region: ${AWS_REGION:ap-south-1}
  security:
    jwt-secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    data-encryption-key: ${SHEGO_DATA_ENCRYPTION_KEY:change-this-local-data-encryption-key}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  storage:
    s3-bucket: ${S3_BUCKET:shego-dev-private}
  maps:
    google-api-key: ${GOOGLE_MAPS_API_KEY:}
